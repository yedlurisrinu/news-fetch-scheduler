services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: news_fetch_scheduler
    environment:
      - PYTHONPATH=src
      - VAULT_ADDR=http://vault-server:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
      - VAULT_SECRET_PATH=secret/DB_SERVICES
    networks:
      - vault-network
      - services_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "cat /proc/1/status | grep -q 'State:.*running\\|State:.*sleeping' || exit 1" ]
      interval: 5m
      start_period: 90s
      start_interval: 10s
      timeout: 10s
      retries: 3
    volumes:
      - ../logs:/app/logs
networks:
  vault-network:
    external: true
  services_network:
    external: true