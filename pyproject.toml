[project]
name = "news-fetch-scheduler"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.3.0",
    "feedparser>=6.0.10",
    "httpx==0.27.1",
    "hvac>=2.1.0,<3.0.0",
    "psycopg[binary,pool]>=3.1.0,<4.0.0",
    "pydantic>=2.0",
    "python-dotenv==1.0.0",
    "python-multipart==0.0.9",
    "schedule>=1.2.1",
    "uvicorn[standard]>=0.18.3",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==8.0.0",
    "pytest-asyncio==0.23.0",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true      # langgraph, langsmith and hvac ship no stubs
warn_unused_ignores = true

[tool.uv]
package = true