[project]
name = "news-fetch-scheduler"
version = "0.1.0"
description = "Scheduled fetcher of RSS and NewsAPI articles; dedups in Postgres and publishes to Kafka"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka==2.16.0",
    "feedparser==6.0.14",
    "httpx==0.27.1",
    "hvac==2.4.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.0",
    "schedule==1.2.2",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==8.0.0",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
warn_unused_ignores = true

# Untyped third-party packages only (no py.typed, no stub package).
# Never set ignore_missing_imports globally: it hides missing first-party modules.
[[tool.mypy.overrides]]
module = ["hvac", "hvac.*", "feedparser"]
ignore_missing_imports = true

[tool.uv]
package = true
